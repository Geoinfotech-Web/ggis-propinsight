[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aia_etl", "aia_etl.tasks"]

[project]
name = "aia-etl"
version = "0.1.0"
description = "GGIS PropInsight (AIA) — ETL & geoprocessing pipelines"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "requests>=2.32",
    # Geo stack (used inside tasks; provided by the GDAL base image at runtime).
    # pysheds 0.5 still uses aliases removed from NumPy 2.x.
    "numpy>=1.26,<2.0",
    "rasterio>=1.3",
    "rio-cogeo>=5.3",
    "pysheds>=0.3",
    # pysheds 0.5 depression filling is incompatible with Numba 0.66 on Python 3.12.
    "numba>=0.61,<0.62",
    "earthengine-api>=1.1",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
