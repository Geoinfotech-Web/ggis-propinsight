name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, type-check, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: propinsight
          POSTGRES_USER: aia
          POSTGRES_PASSWORD: aia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aia -d propinsight"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type-check)
        run: mypy app || true   # advisory until types are fully annotated
      - name: Alembic migrate (ephemeral PostGIS)
        env:
          POSTGRES_HOST: localhost
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  etl:
    name: ETL — lint & pure-logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The geo stack (rasterio/pysheds) needs system GDAL and runs in the ETL
      # image; here we install only what the pure-logic tests need.
      - name: Install test deps
        run: pip install ruff pytest "sqlalchemy>=2.0"
      - name: Ruff (lint)
        run: ruff check aia_etl tests
      - name: Pytest (pure logic)
        run: python -m pytest -q

  web:
    name: Web — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
