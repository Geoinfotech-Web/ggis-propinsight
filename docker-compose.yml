# GGIS PropInsight (AIA) — local development stack
# Brings up: PostGIS, Redis, the FastAPI API, and the mock GGIS Flood Watch server.
# OSRM / Valhalla / TiTiler / martin are added in Phase 1 as data layers land.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propinsight}
      POSTGRES_USER: ${POSTGRES_USER:-aia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aia} -d ${POSTGRES_DB:-propinsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-ggis:
    build: ./services/mock-ggis
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:9100/v1/meta/model'); sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    env_file: .env
    environment:
      # Container-network overrides (compose service names)
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      GGIS_FLOOD_BASE_URL: http://mock-ggis:9100
      GGIS_FLOOD_DATA_MODE: mock
    ports:
      # Host 8001 to coexist with the GGIS Flood Watch stack (which uses 8000).
      - "8001:8000"
    volumes:
      - ./services/api:/app
      - geodata:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-ggis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./apps/web
    environment:
      # Docker Desktop's host gateway stays stable when the API container is
      # rebuilt; using the published port avoids a stale internal DNS/socket.
      API_PROXY_TARGET: http://host.docker.internal:8001
      VITE_USE_POLLING: "1"
      VITE_3D_TERRAIN_ENABLED: ${VITE_3D_TERRAIN_ENABLED:-false}
      VITE_TERRAIN_TILEJSON_URL: ${VITE_TERRAIN_TILEJSON_URL:-https://tiles.mapterhorn.com/tilejson.json}
      VITE_TERRAIN_ENCODING: ${VITE_TERRAIN_ENCODING:-terrarium}
      VITE_TERRAIN_TILE_SIZE: ${VITE_TERRAIN_TILE_SIZE:-512}
      VITE_BUILDINGS_TILEJSON_URL: ${VITE_BUILDINGS_TILEJSON_URL:-https://tiles.openfreemap.org/planet}
    ports:
      - "5174:5174"
    volumes:
      - ./apps/web:/repo/apps/web
      - ./design:/repo/design:ro
      - /repo/apps/web/node_modules   # keep the image's linux node_modules
    depends_on:
      - api

  etl-worker:
    build: ./etl
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      GGIS_FLOOD_BASE_URL: http://mock-ggis:9100
      GGIS_FLOOD_DATA_MODE: mock
      DATA_DIR: /data
    volumes:
      - ./etl:/etl
      - geodata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A aia_etl.celery_app worker --loglevel=INFO

  etl-beat:
    build: ./etl
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./etl:/etl
      - geodata:/data
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A aia_etl.celery_app beat --loglevel=INFO

volumes:
  pgdata:
  geodata:
